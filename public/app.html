<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jovalen — Business Operating System</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="app-body">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand" data-action="nav" data-view="/dashboard">
      <div class="logo">J</div>
      <div class="brand-text">
        <strong>Jovalen</strong>
        <span id="org-name">Business OS</span>
      </div>
    </div>
    <nav class="sidebar-nav" id="nav"></nav>
    <div class="sidebar-foot">
      <button class="btn btn-ghost btn-block" data-action="logout">Log out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" data-action="nav" data-view="/dashboard" title="Dashboard">⌂</button>
        <span id="page-title">Dashboard</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" data-action="nav" data-view="/notifications" id="bell" title="Notifications">
          🔔<span class="badge hidden" id="bell-badge">0</span>
        </button>
        <span class="user-chip" id="user-chip"></span>
      </div>
    </header>
    <main class="content" id="view"><div class="loading">Loading…</div></main>
  </div>

  <div id="modal-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
